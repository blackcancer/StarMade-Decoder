name: Apply verified audit corrections

on:
  push:
    branches: [fix/audit-integrity-complete]
    paths: ['.github/workflows/decoder-validation.yml']

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'blackcancer/StarMade-Decoder' && github.ref == 'refs/heads/fix/audit-integrity-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-integrity-complete
          fetch-depth: 0
      - name: Verify baseline and patch bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet e5f531463825315ada91a92f35b3ca776e2b7c7d HEAD -- . ':(exclude).github/workflows/decoder-validation.yml' ':(exclude).audit-transfer' ':(exclude)src/core/BufferReader.ts' ':(exclude)src/core/BufferWriter.ts' ':(exclude)test/audit-core.test.ts'
          test "$(git hash-object src/core/BufferReader.ts)" = 111f0a3febe03991573a5cefdfbc06229267f989
          test "$(git hash-object src/core/BufferWriter.ts)" = dbd2be87c989070da52540ae47dcd0f92812f560
          test "$(git hash-object test/audit-core.test.ts)" = 1980031da91b2593a90bf3ab37b486acc56416f3
          cp src/core/BufferReader.ts /tmp/concurrent-reader.ts
          cat .audit-transfer/part-{0..5}.bin > /tmp/audit-corrections.xz
          echo 'de68ff73451c4efb638b8620fc8b1ceb8fecfa3bba2069c34788529e86ff44ea  /tmp/audit-corrections.xz' | sha256sum -c -
          xz -dc /tmp/audit-corrections.xz > /tmp/audit-corrections.patch
          echo '652566ae92b552258b0acd9c817570233ee26d277ad1146ed60880e91cd79b2b  /tmp/audit-corrections.patch' | sha256sum -c -
          git restore --source=e5f531463825315ada91a92f35b3ca776e2b7c7d --staged --worktree src/core/BufferReader.ts src/core/BufferWriter.ts
          git apply --check --unidiff-zero /tmp/audit-corrections.patch
      - name: Apply the reviewed integration, retaining concurrent core tests
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --unidiff-zero /tmp/audit-corrections.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/BufferReader.ts')
          ours = p.read_text()
          start = ours.index('  /**\n   * Reads a non-negative int32 collection count')
          end = ours.index('  // ── Internal', start)
          method = ours[start:end]
          current = Path('/tmp/concurrent-reader.ts').read_text()
          merged = current.replace('  /**\n   * @param n Requested byte count.', method + '  /**\n   * @param n Requested byte count.')
          merged = merged.replace('    const count = this.readInt32BE();', '    this._check(4);\n    const count = this.buf.readInt32BE(this._offset);')
          merged = merged.replace('count * minimumItemBytes > this.remaining()', 'count * minimumItemBytes > this.remaining() - 4')
          merged = merged.replace('at offset ${this.offset - 4}', 'at offset ${this.offset}')
          merged = merged.replace('    return count;', '    this._offset += 4;\n    return count;')
          p.write_text(merged)
          PY
          test "$(git hash-object src/core/BufferReader.ts)" = 59368c8d94e3c7d4209b821b46bcbca4c46908f0
          git add src/core/BufferReader.ts
          git rm -r .audit-transfer
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: integrate audited codecs, archive safety and independent regression tests'
          git push origin HEAD:refs/heads/fix/audit-integrity-complete
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
