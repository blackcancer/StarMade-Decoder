name: Decoder validation

on:
  push:
    branches: [main, fix/audit-data-integrity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare patched audit dependency lock
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); p.version='1.5.0'; p.dependencies={'adm-zip':'^0.6.1','fast-xml-parser':'^5.7.3'}; delete p.devDependencies['adm-zip']; delete p.devDependencies['fast-xml-parser']; p.devDependencies.mocha='^12.0.2'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - run: npm ci --ignore-scripts
      - name: Capture reproducible audit workspace
        run: |
          mkdir -p validation
          git archive --format=tar HEAD | gzip > validation/source.tar.gz
          cp package.json package-lock.json validation/
          tar -czf validation/dependencies.tar.gz node_modules
          npm audit --json > validation/dependency-audit.json || true
      - run: npm run build
      - run: npm run docs:check
      - run: npm test
      - run: npm run coverage:check
      - name: Preserve validation workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-validation-workspace
          path: validation/
          retention-days: 7
          if-no-files-found: error
