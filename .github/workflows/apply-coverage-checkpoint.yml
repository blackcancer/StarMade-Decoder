name: Apply verified full-coverage checkpoint

on:
  push:
    branches: [fix/audit-integrity-complete]
    paths:
      - '.github/coverage-checkpoint/**'
      - '.github/workflows/apply-coverage-checkpoint.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'blackcancer/StarMade-Decoder' && github.ref == 'refs/heads/fix/audit-integrity-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize hash-verified source changes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.github/coverage-checkpoint').glob('*.part'))
          assert len(parts) == 17
          data = b''.join(part.read_bytes() for part in parts)
          assert hashlib.sha256(data).hexdigest() == 'e4d5b06882d7f1d2e61d5fedd6c8340fd5df1cd783dd17d5ccfb2e8ac9289147'
          entries = json.loads(lzma.decompress(data))
          assert len(entries) == 28
          planned, seen = [], set()
          for entry in entries:
              name = entry['path']
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert name not in seen
              seen.add(name)
              assert relative.parts[0] in ('src', 'test', 'scripts', 'docs') or name in ('.c8rc.json', 'package.json', 'README.md', 'CHANGELOG.md')
              target = Path(name)
              assert not target.is_symlink() and all(not p.is_symlink() for p in target.parents)
              original = target.read_bytes() if target.exists() else b''
              assert hashlib.sha256(original).hexdigest() == entry['old'], f'Unexpected base: {name}'
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = text.splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == entry['new'], f'Result mismatch: {name}'
              planned.append((target, result))
          for target, result in planned:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(result)
          Path('/tmp/coverage-manifest.json').write_text(json.dumps(entries))
          print(f'Materialized and verified {len(planned)} source changes.')
          PY
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run docs:check
      - name: Exact all-source line and branch coverage
        shell: bash
        run: |
          set -o pipefail
          npm run coverage:check 2>&1 | tee /tmp/coverage-checkpoint.log
          node scripts/test-coverage-gate.mjs 2>&1 | tee /tmp/coverage-negative-gate.log
      - name: Push tested source changes without force
        shell: bash
        env:
          EXPECTED_HEAD: '${{ github.sha }}'
        run: |
          git fetch origin fix/audit-integrity-complete
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          entries = json.loads(Path('/tmp/coverage-manifest.json').read_text())
          for entry in entries:
              assert hashlib.sha256(Path(entry['path']).read_bytes()).hexdigest() == entry['new'], entry['path']
          subprocess.run(['git', 'add', '--', *[e['path'] for e in entries]], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: require exact full-source line and branch coverage'
          git push origin HEAD:refs/heads/fix/audit-integrity-complete
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-coverage-checkpoint-evidence
          path: |
            /tmp/coverage-checkpoint.log
            /tmp/coverage-negative-gate.log
            coverage/coverage-summary.json
            coverage/coverage-final.json
            coverage/lcov.info
          retention-days: 14
