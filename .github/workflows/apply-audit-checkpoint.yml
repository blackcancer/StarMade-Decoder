name: Apply verified audit checkpoint

on:
  push:
    branches: [fix/audit-data-integrity]
    paths: ['.github/audit-checkpoint/**']

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/audit-data-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Materialize digest-verified source checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.github/audit-checkpoint').glob('*.part'))
          assert len(parts) == 4, 'Expected exactly four checkpoint parts'
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '7ffba677e01fd497ba9a1a5bb655352dc46608be975752a1e15c0928524874d6', 'Checkpoint digest mismatch'
          base = json.loads(gzip.decompress(data))
          assert len(base) == 33
          followup = json.loads(Path('.github/audit-checkpoint/followup.json').read_text())
          assert len(followup) == 3
          manifest = {}
          for entries in (base, followup):
              planned = []
              seen = set()
              for entry in entries:
                  name = entry['path']
                  relative = PurePosixPath(name)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert name not in seen
                  seen.add(name)
                  assert relative.parts[0] in ('src', 'test', 'scripts', 'docs') or name in (
                      'package.json', 'package-lock.json', 'README.md', 'CHANGELOG.md',
                      'tsconfig.json', '.github/workflows/decoder-validation.yml')
                  path = Path(name)
                  assert not path.is_symlink()
                  original = path.read_bytes() if path.exists() else b''
                  assert hashlib.sha256(original).hexdigest() == entry['old_sha256'], f'Unexpected base: {name}'
                  lines = original.decode('utf-8').splitlines(keepends=True)
                  for start, end, text in reversed(entry['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = text.splitlines(keepends=True)
                  result = ''.join(lines).encode('utf-8')
                  assert hashlib.sha256(result).hexdigest() == entry['new_sha256'], f'Result mismatch: {name}'
                  planned.append((path, result))
                  manifest[name] = entry
              for path, result in planned:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(result)
          Path('/tmp/audit-manifest.json').write_text(json.dumps(list(manifest.values())))
          print(f'Materialized and verified {len(manifest)} files.')
          PY
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run docs:check
      - name: Complete regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/audit-tests.log
      - name: Independent Java UTF oracle
        shell: bash
        run: |
          set -o pipefail
          npm run test:java 2>&1 | tee /tmp/audit-java.log
      - name: Production-only packed consumer
        shell: bash
        run: |
          set -o pipefail
          npm run test:package 2>&1 | tee /tmp/audit-package.log
      - name: Coverage gate
        shell: bash
        run: |
          set -o pipefail
          npm run coverage:check 2>&1 | tee /tmp/audit-coverage.log
      - name: Push verified source checkpoint without force
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          entries = json.loads(Path('/tmp/audit-manifest.json').read_text())
          for entry in entries:
              assert hashlib.sha256(Path(entry['path']).read_bytes()).hexdigest() == entry['new_sha256'], entry['path']
          # Workflow changes are published separately through the connector.
          paths = [e['path'] for e in entries if not e['path'].startswith('.github/workflows/')]
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.github/audit-checkpoint'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: enforce archive and Tag integrity; ship validated production package'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/audit-data-integrity'], check=True)
          PY
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-checkpoint-validation
          path: /tmp/audit-*.log
          retention-days: 7
          if-no-files-found: warn
